server: {port: 8080}
spring:
  application: {name: api-gateway}
  cloud:
    gateway:
      discovery.locator:
        enabled: true
        lower-case-service-id: true
    discovery:
      client:
        simple:
          instances: {}
eureka:
  client: {service-url: {defaultZone: http://discovery-server:8761/eureka/}}
management.endpoints.web.exposure.include: health,info,gateway
